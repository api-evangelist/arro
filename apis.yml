name: Arro
description: Arro is a consumer fintech company that helps people build or rebuild credit without
  traditional barriers. Its flagship product is the Arro Card, a Mastercard with no deposit and no
  hard credit check that starts at up to $300 and grows to $2,500, issued by Community Federal Savings
  Bank (member FDIC). The Arro app pairs the card with financial-education lessons, credit tracking,
  personalized guidance, and Artie, an AI money coach. Arro is a mobile-first consumer product and does
  not publish a public developer API, OpenAPI, or developer portal at this time.
